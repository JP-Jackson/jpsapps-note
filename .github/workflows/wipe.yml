name: Wipe data (remote D1)

# Empties every user-data table in production and keeps users, the OAuth
# tokens (the Claude connection) and the templates. Photos and files in R2 are
# NOT removed by this; the count printed first says whether any exist.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "wipe" to confirm emptying production data'
        required: true
        default: ""

jobs:
  wipe:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        if: inputs.confirm != 'wipe'
        run: |
          echo "Confirmation did not match. Type 'wipe' to proceed." >&2
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: What is there
        run: npx wrangler d1 execute note --remote --command "SELECT (SELECT COUNT(*) FROM entries) AS entries, (SELECT COUNT(*) FROM subjects) AS subjects, (SELECT COUNT(*) FROM places) AS places, (SELECT COUNT(*) FROM people) AS people, (SELECT COUNT(*) FROM attachments) AS attachments, (SELECT COUNT(*) FROM attachments WHERE r2_key IS NOT NULL) AS r2_objects"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Wipe
        run: npx wrangler d1 execute note --remote --file scripts/wipe-data.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: What is left
        run: npx wrangler d1 execute note --remote --command "SELECT (SELECT COUNT(*) FROM entries) AS entries, (SELECT COUNT(*) FROM subjects) AS subjects, (SELECT COUNT(*) FROM places) AS places, (SELECT COUNT(*) FROM users) AS users, (SELECT COUNT(*) FROM oauth_tokens WHERE revoked_at IS NULL) AS connections"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
