<!doctype html>
<html lang="en" data-app="note">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16222E">
<meta name="app-version" content="1.4.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Note">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Note</title>
<script>
/* Runs before first paint: reading the stored preference after render would show a
   flash of the wrong theme on every cold start. Wrapped because storage throws in
   some privacy modes, and a broken picker must never stop the app loading. */
(function () {
  try {
    var t = localStorage.getItem("note.theme");
    var f = localStorage.getItem("note.font");
    var c = localStorage.getItem("note.contrast");
    if (t && t !== "system") document.documentElement.dataset.theme = t;
    if (f && f !== "inter") document.documentElement.dataset.font = f;
    if (c === "high") document.documentElement.dataset.contrast = c;
  } catch (e) {}
})();
</script>
<style>
  /* Self-hosted so they render identically with no signal (§2) and get cached by the
     service worker. A @font-face is lazy: the browser downloads a face only when
     something on screen actually uses it, so the two alternates cost nothing unless
     they are picked. */
  @font-face{font-family:"Inter";font-weight:400;font-display:swap;src:url(/fonts/inter-400.woff2) format("woff2")}
  @font-face{font-family:"Inter";font-weight:700;font-display:swap;src:url(/fonts/inter-700.woff2) format("woff2")}
  @font-face{font-family:"Winky Sans";font-weight:400;font-display:swap;src:url(/fonts/winky-400.woff2) format("woff2")}
  @font-face{font-family:"Winky Sans";font-weight:700;font-display:swap;src:url(/fonts/winky-700.woff2) format("woff2")}
  @font-face{font-family:"Roboto";font-weight:400;font-display:swap;src:url(/fonts/roboto-400.woff2) format("woff2")}
  @font-face{font-family:"Roboto";font-weight:700;font-display:swap;src:url(/fonts/roboto-700.woff2) format("woff2")}
  @font-face{font-family:"Ubuntu";font-weight:400;font-display:swap;src:url(/fonts/ubuntu-400.woff2) format("woff2")}
  @font-face{font-family:"Ubuntu";font-weight:700;font-display:swap;src:url(/fonts/ubuntu-700.woff2) format("woff2")}
  @font-face{font-family:"Public Sans";font-weight:400;font-display:swap;src:url(/fonts/publicsans-400.woff2) format("woff2")}
  @font-face{font-family:"Public Sans";font-weight:700;font-display:swap;src:url(/fonts/publicsans-700.woff2) format("woff2")}
  /* The wordmark's face is brand, not a preference — it never follows --font-ui,
     which is why the header stopped changing shape when the UI font changes. */
  @font-face{font-family:"Caveat";font-weight:700;font-display:block;src:url(/fonts/caveat-700.woff2) format("woff2")}
  @font-face{font-family:"IBM Plex Mono";font-weight:400;font-display:swap;src:url(/fonts/plexmono-400.woff2) format("woff2")}
  @font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(/fonts/plexmono-500.woff2) format("woff2")}

  /* Palette and type per NOTE_SPEC.md §10. Every colour is a token, so a theme is a
     named set of values (§10: "ship the picker"). Dark surfaces sit at 12-15%
     lightness, not near-black. --font-ui is the same idea applied to type.
     Three blocks, because the theme has three states: light, dark, and "follow the
     system". Bare :root is light; the media query supplies dark only when the user
     has not explicitly chosen light; the attribute rule lets an explicit choice win
     in both directions. */
  :root{
    --navy:#16222E; --blue:#2C7BC4; --blue-deep:#1B5486;
    --bg:#E6E9EC; --card:#FFF; --ink:#121A22; --ink-2:#586573; --line:#D2D8DE;
    --ok:#1f7a4d; --warn:#D9931A; --bad:#D9483C;
    --press:4px; --nav-h:60px;
    --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --font-brand:"Caveat",cursive;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#171B20; --card:#222831; --ink:#E6EBF0; --ink-2:#94A1AE; --line:#323A45;
      --blue:#5AA9EE; --blue-deep:#2C7BC4;
      --ok:#5ad699; --warn:#F0B44C; --bad:#FF8478;
    }
  }
  :root[data-theme="dark"]{
    --bg:#171B20; --card:#222831; --ink:#E6EBF0; --ink-2:#94A1AE; --line:#323A45;
    --blue:#5AA9EE; --blue-deep:#2C7BC4;
    --ok:#5ad699; --warn:#F0B44C; --bad:#FF8478;
  }
  /* High contrast is a separate axis from light/dark, so it layers on top of
     whichever theme is active. §10 deliberately keeps dark surfaces at 12-15%
     lightness to avoid glare — that is the right default, but when someone asks for
     high contrast they are overriding exactly that trade, so this goes further than
     the house palette on purpose. */
  :root[data-contrast="high"]{
    --bg:#FFFFFF; --card:#FFFFFF; --ink:#000000; --ink-2:#26303A; --line:#000000;
    --blue:#0B4F8F; --blue-deep:#062F55;
    --ok:#0A5C36; --warn:#7A4A00; --bad:#A31408;
  }
  @media (prefers-color-scheme:dark){
    :root[data-contrast="high"]:not([data-theme="light"]){
      --bg:#000000; --card:#0B0F14; --ink:#FFFFFF; --ink-2:#D6DEE6; --line:#FFFFFF;
      --blue:#7CC0F5; --blue-deep:#2C7BC4;
      --ok:#6BF0AE; --warn:#FFC861; --bad:#FF9A8F;
    }
  }
  :root[data-theme="dark"][data-contrast="high"]{
    --bg:#000000; --card:#0B0F14; --ink:#FFFFFF; --ink-2:#D6DEE6; --line:#FFFFFF;
    --blue:#7CC0F5; --blue-deep:#2C7BC4;
    --ok:#6BF0AE; --warn:#FFC861; --bad:#FF9A8F;
  }
  /* Thin hairlines are the first thing to disappear for low vision, so thicken them. */
  :root[data-contrast="high"] .entry,
  :root[data-contrast="high"] .chip,
  :root[data-contrast="high"] .fontrow,
  :root[data-contrast="high"] textarea,
  :root[data-contrast="high"] input[type=search]{border-width:2px}
  :root[data-contrast="high"] header .host{color:rgba(255,255,255,.7)}
  :root[data-contrast="high"] #ver{color:rgba(255,255,255,.8)}

  /* --name-lift centres the wordmark's INK against the icon. Every font needs its
     own value because cap height and baseline position differ, and the font is
     user-selectable — one shared number would be wrong for four of the five. Each
     was measured by rendering at 3x and comparing white-pixel centres, not guessed.
     Add a font, measure a lift. */
  :root                        { --font-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif }
  :root[data-font="winky"]     { --font-ui:"Winky Sans",system-ui,sans-serif }
  :root[data-font="roboto"]    { --font-ui:"Roboto",system-ui,sans-serif }
  :root[data-font="ubuntu"]    { --font-ui:"Ubuntu",system-ui,sans-serif }
  :root[data-font="publicsans"]{ --font-ui:"Public Sans",system-ui,sans-serif }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* Must outrank the display rules below (.shot video, .btn) — a class+element
     selector beats the UA stylesheet's [hidden], so without this the hidden
     attribute silently does nothing and the viewfinder never gives way to the shot. */
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:400 16px/1.5 var(--font-ui);
    overscroll-behavior-y:contain}

  /* ---------- chrome ---------- */
  header{background:var(--navy);color:#fff;padding:10px 14px;
    padding-top:calc(10px + env(safe-area-inset-top));
    display:flex;align-items:center;gap:11px;position:sticky;top:0;z-index:20}
  header .mark{flex:none;display:block;width:38px;height:38px}
  /* align-items:center centres the text BOX; all-caps ink sits in its upper part
     because the descender space below the baseline is empty, so the word reads high.
     The nudge is measured against the shipped font, not guessed — see --name-lift. */
  header .name{font-family:var(--font-brand);font-weight:700;font-size:46px;line-height:1;
    display:flex;align-items:baseline;gap:9px;white-space:nowrap;
    transform:translateY(var(--name-lift,0px))}
  /* The build, next to the name — the first thing to check when something looks wrong. */
  #ver{font:400 9px/1 var(--font-mono);letter-spacing:.03em;
    color:rgba(255,255,255,.42);white-space:nowrap;align-self:flex-end;
    padding-bottom:9px;margin-left:-3px}
  #ver.stale{color:var(--warn)}
  /* Present but recessive: says which app this is without competing with it. */
  header .host{font:400 9px/1 var(--font-mono);
    letter-spacing:.06em;color:rgba(255,255,255,.24);white-space:nowrap}
  /* Status is a dot PLUS small text, always visible (§6). The word does the work. */
  /* Status over domain, right-aligned: the pair that changes lives opposite the
     pair that identifies. */
  header .meta-r{margin-left:auto;display:flex;flex-direction:column;
    align-items:flex-end;gap:5px;min-width:0}
  #status{display:flex;align-items:center;gap:6px;
    font:500 11px/1 var(--font-mono);letter-spacing:.08em;
    color:#cfd8e0;text-transform:uppercase}
  #dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
  #status.offline #dot{background:var(--warn)}
  #status.syncing #dot{background:#8ab4dd;animation:pulse 1s ease-in-out infinite}
  #status.error #dot{background:var(--bad)}
  @keyframes pulse{50%{opacity:.25}}

  main{max-width:560px;margin:0 auto;padding:16px 16px calc(var(--nav-h) + 40px)}

  /* ---------- toolbox buttons: hard 4px shadow, visibly depress (§10) ---------- */
  .btn{display:block;width:100%;border:0;border-radius:12px;
    background:var(--blue);color:#fff;font:700 17px/1 var(--font-ui);
    padding:20px 16px;cursor:pointer;
    box-shadow:0 var(--press) 0 var(--blue-deep);
    transform:translateY(0);transition:transform .06s,box-shadow .06s}
  .btn:active{transform:translateY(var(--press));box-shadow:0 0 0 var(--blue-deep)}
  .btn[disabled]{opacity:.5;pointer-events:none}
  .btn.ghost{background:var(--card);color:var(--ink);
    box-shadow:0 var(--press) 0 var(--line);border:1px solid var(--line)}
  .btn.ghost:active{box-shadow:0 0 0 var(--line)}
  .btn.sm{padding:13px 14px;font-size:15px}

  /* ---------- capture ---------- */
  .shot{position:relative;width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;
    background:var(--navy);border:1px solid var(--line);margin-bottom:12px;display:none}
  .shot.on{display:block}
  .shot video,.shot img{width:100%;height:100%;object-fit:cover;display:block}
  .shutter{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    width:64px;height:64px;border-radius:50%;border:4px solid #fff;background:#ffffff40;
    cursor:pointer}
  .shutter:active{background:#ffffff90}
  .retake{position:absolute;right:10px;top:10px;background:#0009;color:#fff;border:0;
    border-radius:8px;padding:8px 12px;font:600 13px var(--font-ui);cursor:pointer}

  textarea{width:100%;min-height:96px;resize:vertical;border-radius:12px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:14px;font:400 17px/1.45 var(--font-ui);margin-bottom:12px}
  textarea:focus{outline:2px solid var(--blue);outline-offset:-1px}
  input[type=search]{width:100%;border-radius:12px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);padding:15px 14px;
    font:400 17px var(--font-ui);margin-bottom:12px}
  input[type=search]:focus{outline:2px solid var(--blue);outline-offset:-1px}

  .chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .chip{flex:1 1 0;min-width:88px;padding:14px 10px;border-radius:10px;
    border:1px solid var(--line);background:var(--card);color:var(--ink-2);
    font:600 14px var(--font-ui);cursor:pointer;text-align:center}
  .chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .chip[aria-pressed="true"]{
      background:var(--blue);border-color:var(--blue);color:#0b1219}
  }
  :root[data-theme="dark"] .chip[aria-pressed="true"]{
    background:var(--blue);border-color:var(--blue);color:#0b1219}

  .row{display:flex;align-items:center;gap:10px;margin-bottom:14px;
    color:var(--ink-2);font-size:14px}
  .row input{width:22px;height:22px;accent-color:var(--blue)}

  /* ---------- lists ---------- */
  h2{font:600 12px/1 var(--font-mono);letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-2);margin:22px 0 10px}
  .entry{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;
    width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
  .entry .when{font:500 11px/1.5 var(--font-mono);color:var(--ink-2);
    white-space:nowrap;padding-top:2px}
  .entry .what{flex:1;min-width:0;word-wrap:break-word}
  .entry .tag{font:500 10px/1 var(--font-mono);letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-2);display:block;margin-top:5px}
  .entry.pending{border-style:dashed;opacity:.75;cursor:default}
  .entry.open{border-left:4px solid var(--warn)}
  .empty{color:var(--ink-2);font-size:14px;padding:6px 2px}
  .err{background:#d9483c1a;border:1px solid var(--bad);color:var(--bad);
    border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px;display:none}
  .err.on{display:block}

  /* ---------- day stepper ---------- */
  .stepper{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .stepper button{width:52px;height:48px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);font:700 20px/1 var(--font-ui);cursor:pointer}
  .stepper button[disabled]{opacity:.35;pointer-events:none}
  .stepper .label{flex:1;text-align:center;font:600 15px var(--font-ui)}

  /* ---------- bottom nav ---------- */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
    background:var(--navy);border-top:1px solid #0006;
    padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;height:var(--nav-h);border:0;background:none;color:#8fa3b5;
    font:600 11px/1.3 var(--font-mono);letter-spacing:.06em;
    text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:5px;position:relative}
  nav button svg{width:21px;height:21px}
  nav button[aria-current="true"]{color:#fff}
  nav button[aria-current="true"] svg{stroke:var(--blue)}
  .badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--warn);
    color:#16222E;border-radius:99px;min-width:18px;padding:0 5px;
    font:700 10px/18px var(--font-mono);text-align:center}

  /* ---------- detail ---------- */
  #detail{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;
    padding:0 0 40px}
  #detail .bar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;
    padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));
    position:sticky;top:0}
  #detail .bar button{background:none;border:0;color:#fff;font:600 15px var(--font-ui);
    cursor:pointer;padding:4px 0}
  #detail .body{max-width:560px;margin:0 auto;padding:16px}
  #detail img.photo{width:100%;border-radius:12px;border:1px solid var(--line);
    margin-bottom:10px;display:block}
  .meta{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0}
  .meta dt{font:500 11px/1.6 var(--font-mono);text-transform:uppercase;
    color:var(--ink-2)}
  .meta dd{margin:0;font:400 13px/1.6 var(--font-mono);word-break:break-word}
  .rawnote{background:var(--card);border:1px solid var(--line);
    border-left:4px solid var(--ink-2);border-radius:8px;padding:10px 12px;margin:12px 0;
    font-size:14px;color:var(--ink-2)}
  .rawnote b{display:block;font:600 10px/1.6 var(--font-mono);
    letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
  .thread{font-size:13px;color:var(--ink-2);margin:16px 0 4px;
    font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em}
  .actions{display:flex;gap:8px;margin-top:14px}
  .actions .btn{flex:1}

  /* ---------- settings ---------- */
  #gear{background:none;border:0;color:rgba(255,255,255,.55);cursor:pointer;padding:4px;
    flex:none;display:flex;margin-left:2px}
  #gear svg{width:20px;height:20px}
  #gear:active{color:#fff}
  #settings{position:fixed;inset:0;z-index:41;background:var(--bg);overflow-y:auto;padding:0 0 40px}
  #settings .bar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;
    padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));position:sticky;top:0}
  #settings .bar button{background:none;border:0;color:#fff;font:600 15px var(--font-ui);
    cursor:pointer;padding:4px 0}
  #settings .body{max-width:560px;margin:0 auto;padding:16px}
  .fontlist{display:flex;flex-direction:column;gap:8px}
  /* Each row is set in its own face — you judge the font by reading it, not its name. */
  .fontrow{display:block;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--line);border-radius:10px;padding:13px 14px;cursor:pointer;
    color:var(--ink)}
  .fontrow[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
  .fname{display:block;font-weight:700;font-size:17px;margin-bottom:4px}
  .fsample{display:block;font-size:14px;color:var(--ink-2);line-height:1.3}

  /* ---------- splash (§10: note-splash-final.html, 4.21s) ----------
     Plays on cold start only; a sessionStorage flag skips it on reload. Any touch
     ends it immediately — §1 makes capture speed the deciding property, and a cold
     start is exactly the pull-the-phone-out moment, so the animation must never be
     something you have to sit through. */
  #splash{position:fixed;inset:0;z-index:9999;
    --tile:#16222E; --accent:#2C7BC4; --halo:#7CC0F5;
    --glow:rgba(150,205,250,1); --glow-0:rgba(150,205,250,0); --wash:#CFE6FA;
    background:var(--tile);display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:22px}
  #splash.done{display:none}
  #wash{position:absolute;inset:0;background:var(--wash);opacity:0;pointer-events:none}
  #splash svg{width:112px;height:112px;overflow:visible}
  #splash .tile{fill:var(--tile);opacity:0}
  #splash .mk path{fill:none;stroke:#fff;stroke-linecap:butt;stroke-linejoin:miter;
    stroke-dasharray:var(--len,300);stroke-dashoffset:var(--len,300)}
  #splash .kl{fill:none;stroke:var(--accent);stroke-width:4;
    stroke-dasharray:var(--kl,400);stroke-dashoffset:var(--kl,400)}
  #splash .flash{fill:none;stroke:#fff;stroke-width:4;opacity:0}
  #splash .halo,#splash .spark{fill:none;stroke-linecap:round;
    stroke-dasharray:26 var(--kl,400);stroke-dashoffset:26px}
  #splash .halo{stroke:var(--halo);stroke-width:12;filter:blur(6px)}
  #splash .spark{stroke:#fff;stroke-width:5;filter:drop-shadow(0 0 7px var(--halo))}
  #splash .word{text-align:center}
  /* One continuous left-to-right reveal across the whole word — a pen moving, not
     four letters appearing. It must be a single clip: splitting the word into
     per-letter spans clips each glyph at its own advance width, and a script face
     draws ink well past that, so the letters came out sliced and overlapping.
     A clip rather than stroke-dashoffset because these are filled glyph outlines,
     and dash-animating an outline traces a letter's edge instead of writing it. */
  #splash .word .n{font-family:var(--font-brand);font-size:46px;font-weight:700;
    color:#fff;line-height:1.15;clip-path:inset(0 100% -25% 0);will-change:clip-path}
  #splash .word .d{font-family:var(--font-mono);font-size:9.5px;font-weight:600;
    letter-spacing:.22em;color:rgba(255,255,255,.5);margin-top:9px;opacity:0}

  .go .tile{animation:fade .21s ease-out 0s forwards}
  .go .bar{animation:draw .36s cubic-bezier(.45,0,.25,1) .20s forwards}
  .go .stem{animation:draw .35s cubic-bezier(.45,0,.25,1) .39s forwards}
  .go .kl{animation:draw .50s cubic-bezier(.7,0,.84,0) .74s forwards}
  .go .halo,.go .spark{animation:chase .50s cubic-bezier(.7,0,.84,0) .74s forwards}
  .go .flash{animation:bloom 1.70s linear 1.24s forwards}
  .go .mk{animation:breath 1.70s linear 1.27s forwards;transform-origin:60px 60px}
  .go #wash{animation:wash 1.30s linear 1.30s forwards}
  /* 2.05s to 2.85s, so the domain still fades in behind the last stroke and the
     stillness before the clear is unchanged. Eased out, the way a hand slows at the
     end of a word. */
  .go .word .n{animation:writeIn .80s cubic-bezier(.3,0,.35,1) 2.05s forwards}
  .go .word .d{animation:fade .60s ease-out 2.75s forwards}
  .go{animation:clear .36s ease-in 3.85s forwards}

  @keyframes fade{to{opacity:1}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes chase{to{stroke-dashoffset:calc(0px - var(--kl,400) * 1px)}}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  /* Negative insets keep the tail of the "e" and any overhang from being cut. */
  @keyframes writeIn{from{clip-path:inset(0 100% -25% 0)}to{clip-path:inset(0 -12% -25% 0)}}
  @keyframes bloom{
    0%{opacity:0;stroke-width:4;filter:drop-shadow(0 0 0 var(--glow-0))}
    34%{opacity:1;stroke-width:8;filter:drop-shadow(0 0 30px var(--glow))}
    100%{opacity:0;stroke-width:4;filter:drop-shadow(0 0 0 var(--glow-0))}}
  @keyframes breath{
    0%{filter:drop-shadow(0 0 0 var(--glow-0));transform:scale(1)}
    28%{filter:drop-shadow(0 0 26px var(--glow));transform:scale(1.035)}

  @keyframes clear{to{opacity:0;visibility:hidden}}

    .go *{animation:none!important}
    #splash .tile,#splash .word .n,#splash .word .d{opacity:1!important;transform:none!important}

    padding:12px 14px;width:100%;margin-bottom:12px;cursor:pointer;
    font:600 14px var(--font-ui);display:none}

</style>

<script>
/* ------------------------------------------------------------------ constants */
const CTX_KEY = "note.lastContext";
const MAX_EDGE = 1600;      // §5: 1600px long edge, JPEG q80. Roughly a quarter the
const QUALITY  = 0.8;       // size, and nameplates and part numbers stay readable.

const $ = (id) => document.getElementById(id);
const err = (msg) => { $("err").textContent = msg; $("err").classList.toggle("on", !!msg); };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtTime = (ms) => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const fmtFull = (ms) => new Date(ms).toLocaleString([], {
  weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });

/* ------------------------------------------------------------------ version
   The page carries its own version, stamped at build time by scripts/sync-version.mjs.
   Comparing it against the Worker's catches the one case that matters: the service
   worker served a cached shell from an older release, so what you are looking at is
   not what is deployed. Showing only the server's number would report "current" for a
   page that is not. */
const PAGE_VERSION =
  document.querySelector('meta[name="app-version"]')?.content || "unknown";

async function checkVersion() {
  $("ver").textContent = "v" + PAGE_VERSION;
  $("ver").classList.remove("stale");
  try {
    const h = await (await fetch("/api/health", { cache: "no-store" })).json();
    if (!h.version || h.version === PAGE_VERSION) return;
    // Header is narrow: "v1.1.0 → v1.2.0" says everything the banner elaborates on.
    $("ver").textContent = "v" + PAGE_VERSION + " \u2192 v" + h.version;
    $("ver").classList.add("stale");
    $("stale").classList.add("on");
  } catch { /* offline: the page's own version is all we can honestly claim */ }
}

/**
 * Notice a deploy without being restarted.
 *
 * The service worker is network-first for the shell, so simply reopening the app
 * picks up a new release. What that misses is an app left open on the bench for
 * hours: it would keep running an old build with nothing to say so. Re-checking when
 * it comes back to the foreground closes that, and asking the browser to re-fetch
 * sw.js means the next load is already the new one.
 */
async function refreshServiceWorker() {
  try {
    const reg = await navigator.serviceWorker?.getRegistration?.();
    await reg?.update();
  } catch {}
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  checkVersion();
  refreshServiceWorker();
});
setInterval(() => { if (!document.hidden) checkVersion(); }, 15 * 60 * 1000);

$("stale").addEventListener("click", async () => {
  // Drop the cached shell first, or the service worker just serves the old one again.
  try {
    if ("caches" in window) {
      for (const k of await caches.keys()) await caches.delete(k);
    }
    const regs = (await navigator.serviceWorker?.getRegistrations?.()) || [];
    await Promise.all(regs.map((r) => r.unregister()));
  } catch {}
  location.reload();
});

/* ------------------------------------------------------------------ IndexedDB
   The queue is the whole offline story (§6). An entry is written here BEFORE any
   network attempt, so a capture in a dead zone is durable the moment you hit save —
   losing one is the failure that kills trust in the tool. */
const DB_NAME = "note", STORE = "queue";
let idb;

function openDb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => {
      if (!r.result.objectStoreNames.contains(STORE)) {
        r.result.createObjectStore(STORE, { keyPath: "id" });
      }
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(mode) { return idb.transaction(STORE, mode).objectStore(STORE); }
function put(rec)  { return new Promise((res, rej) => { const q = tx("readwrite").put(rec); q.onsuccess = res; q.onerror = () => rej(q.error); }); }
function del(id)   { return new Promise((res, rej) => { const q = tx("readwrite").delete(id); q.onsuccess = res; q.onerror = () => rej(q.error); }); }
function all()     { return new Promise((res, rej) => { const q = tx("readonly").getAll();   q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }

/* ------------------------------------------------------------------ camera
   §5: capture happens inside the app, not via the phone's camera app — that is what
   keeps photos in R2 and out of Google Photos, which has no API here and so can never
   be searched or referenced. getUserMedia is the only way to do that; the file input
   is a fallback for when permission is refused. */
let stream = null, photoBlob = null;

async function openCamera() {
  err("");
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 } },
      audio: false,
    });
    $("video").srcObject = stream;
    await $("video").play();
    $("shot").classList.add("on");
    $("video").hidden = false;
    $("preview").hidden = true;
    $("shutter").hidden = false;
    $("retake").hidden = true;
    $("camBtn").hidden = true;
  } catch {
    // Permission denied, no camera, or an insecure context. Fall back rather than
    // dead-end: a capture tool that refuses to capture is worthless.
    $("filePick").click();
  }
}

function stopCamera() {
  if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
  $("video").srcObject = null;
}

/** Draw to a canvas at 1600px long edge and re-encode as JPEG q80. */
async function compress(source, w, h) {
  const scale = Math.min(1, MAX_EDGE / Math.max(w, h));
  const cw = Math.round(w * scale), ch = Math.round(h * scale);
  const canvas = document.createElement("canvas");
  canvas.width = cw; canvas.height = ch;
  canvas.getContext("2d").drawImage(source, 0, 0, cw, ch);
  return new Promise((res) => canvas.toBlob(res, "image/jpeg", QUALITY));
}

async function shoot() {
  const v = $("video");
  photoBlob = await compress(v, v.videoWidth, v.videoHeight);
  stopCamera();
  $("preview").src = URL.createObjectURL(photoBlob);
  $("video").hidden = true;
  $("preview").hidden = false;
  $("shutter").hidden = true;
  $("retake").hidden = false;
}

$("filePick").addEventListener("change", async (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const bmp = await createImageBitmap(f);
  photoBlob = await compress(bmp, bmp.width, bmp.height);
  bmp.close();
  $("preview").src = URL.createObjectURL(photoBlob);
  $("shot").classList.add("on");
  $("video").hidden = true;
  $("preview").hidden = false;
  $("shutter").hidden = true;
  $("retake").hidden = false;
  $("camBtn").hidden = true;
});

function clearPhoto() {
  stopCamera();
  photoBlob = null;
  $("shot").classList.remove("on");
  $("preview").removeAttribute("src");
  $("camBtn").hidden = false;
}

$("camBtn").addEventListener("click", openCamera);
$("shutter").addEventListener("click", shoot);
$("retake").addEventListener("click", () => { clearPhoto(); openCamera(); });

/* ------------------------------------------------------------------ context chips */
let context = localStorage.getItem(CTX_KEY) || "work";
function paintChips() {
  document.querySelectorAll(".chip").forEach((c) => {
    c.setAttribute("aria-pressed", String(c.dataset.ctx === context));
  });
}
$("chips").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  context = chip.dataset.ctx;
  localStorage.setItem(CTX_KEY, context);   // remembered, so the common case is 0 taps
  paintChips();
});
paintChips();

/* ------------------------------------------------------------------ location
   Every entry stores raw coordinates always (§4). Never block the save on it —
   a fix can take seconds and capture speed decides whether this habit survives. */
function coords() {
  return new Promise((res) => {
    if (!navigator.geolocation) return res({ lat: null, lng: null });
    const t = setTimeout(() => res({ lat: null, lng: null }), 2500);
    navigator.geolocation.getCurrentPosition(
      (p) => { clearTimeout(t); res({ lat: p.coords.latitude, lng: p.coords.longitude }); },
      () => { clearTimeout(t); res({ lat: null, lng: null }); },
      { enableHighAccuracy: true, timeout: 2500, maximumAge: 60000 },
    );
  });
}

/* ------------------------------------------------------------------ save + sync */
$("save").addEventListener("click", async () => {
  const text = $("body").value.trim();
  if (!text && !photoBlob) { err("Add a note or a photo first."); return; }
  err("");
  $("save").disabled = true;

  const { lat, lng } = await coords();
  const rec = {
    id: crypto.randomUUID(),          // §6: the device owns the id, so no collisions
    created_at: Date.now(),           //     and an offline entry lands whenever it lands
    context,
    body: text || null,
    lat, lng,
    is_open: $("isOpen").checked,
    photo: photoBlob || null,
  };

  await put(rec);                     // durable BEFORE any network attempt
  $("body").value = "";
  $("isOpen").checked = false;
  clearPhoto();
  $("save").disabled = false;
  renderRecent();
  flush();
});

let flushing = false;
async function flush() {
  if (flushing) return;
  if (!navigator.onLine) { paintStatus(); return; }
  flushing = true; paintStatus();

  try {
    for (const rec of await all()) {
      const res = await fetch("/api/entries", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          id: rec.id, created_at: rec.created_at, context: rec.context,
          body: rec.body, lat: rec.lat, lng: rec.lng, is_open: rec.is_open,
        }),
      });
      // 401/403 means the Access session lapsed. Keep the queue and reload into login;
      // dropping a capture because a cookie expired would be unforgivable.
      if (res.status === 401 || res.status === 403) { location.reload(); return; }
      if (!res.ok) throw new Error("entry " + res.status);

      if (rec.photo) {
        const up = await fetch("/api/photos?entry_id=" + encodeURIComponent(rec.id), {
          method: "POST",
          headers: { "content-type": rec.photo.type || "image/jpeg" },
          body: rec.photo,
        });
        if (!up.ok) throw new Error("photo " + up.status);
      }
      await del(rec.id);              // only once BOTH parts are safely up
    }
    err("");
  } catch {
    paintStatus("error");             // leave the queue intact and retry later
  } finally {
    flushing = false;
    paintStatus();
    renderRecent();
    loadRecent();
    loadOpenCount();
  }
}

/* ------------------------------------------------------------------ status */
async function paintStatus(force) {
  const n = (await all()).length;
  const el = $("status"), txt = $("statusText");
  el.className = "";
  if (force === "error") { el.className = "error"; txt.textContent = n + " QUEUED · RETRYING"; return; }
  if (flushing)          { el.className = "syncing"; txt.textContent = "SYNCING…"; return; }
  if (!navigator.onLine) { el.className = "offline"; txt.textContent = n ? "OFFLINE · " + n + " QUEUED" : "OFFLINE"; return; }
  if (n)                 { el.className = "offline"; txt.textContent = n + " QUEUED"; return; }
  txt.textContent = "SYNCED";
}

/* ------------------------------------------------------------------ lists */
function entryRow(e, opts) {
  opts = opts || {};
  const el = document.createElement(opts.pending ? "div" : "button");
  el.className = "entry" + (opts.pending ? " pending" : "") + (e.is_open ? " open" : "");
  if (!opts.pending) el.dataset.id = e.id;
  const when = opts.full ? fmtFull(e.created_at) : fmtTime(e.created_at);
  const tag = [e.context, e.is_open ? "open" : null, opts.pending ? "queued" : null]
    .filter(Boolean).join(" · ");
  el.innerHTML = '<span class="when">' + esc(when) + '</span>' +
    '<span class="what">' + esc(e.body || "(photo)") +
    '<span class="tag">' + esc(tag) + '</span></span>';
  return el;
}

function fill(node, entries, emptyMsg, opts) {
  node.replaceChildren();
  if (!entries.length) {
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = emptyMsg;
    node.append(d);
    return;
  }
  entries.forEach((e) => node.append(entryRow(e, opts)));
}

/* The capture screen's own short list: queued items plus what the server has. */
let recent = [];
async function loadRecent() {
  if (!navigator.onLine) return;
  try {
    const r = await fetch("/api/entries?limit=10");
    if (r.ok) { recent = (await r.json()).entries || []; renderRecent(); }
  } catch {}
}
async function renderRecent() {
  const queued = (await all()).map((q) => Object.assign({}, q, { pending: true }));
  const node = $("log");
  node.replaceChildren();
  const rows = queued.concat(recent).slice(0, 10);
  if (!rows.length) { fill(node, [], "Nothing yet."); return; }
  rows.forEach((e) => node.append(entryRow(e, { pending: e.pending })));
  paintStatus();
}

/* ---- day log ---- */
let dayOffset = 0;
function dayBounds(offset) {
  const start = new Date();
  start.setHours(0, 0, 0, 0);
  start.setDate(start.getDate() + offset);
  const end = new Date(start);
  end.setDate(end.getDate() + 1);        // via setDate so a DST change stays correct
  return { from: start.getTime(), to: end.getTime(), start: start };
}
async function loadDay() {
  const b = dayBounds(dayOffset);
  $("dayLabel").textContent =
    dayOffset === 0 ? "Today"
    : dayOffset === -1 ? "Yesterday"
    : b.start.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
  $("dayNext").disabled = dayOffset >= 0;   // there are no captures in the future
  try {
    const r = await fetch("/api/entries?view=day&from=" + b.from + "&to=" + b.to);
    const d = await r.json();
    fill($("dayList"), d.entries || [], "Nothing logged this day.");
  } catch {
    fill($("dayList"), [], "Offline — the log needs a connection.");
  }
}
$("dayPrev").addEventListener("click", () => { dayOffset--; loadDay(); });
$("dayNext").addEventListener("click", () => { if (dayOffset < 0) { dayOffset++; loadDay(); } });

/* ---- open items ---- */
async function loadOpen() {
  try {
    const r = await fetch("/api/entries?view=open");
    const d = await r.json();
    const list = d.entries || [];
    fill($("openList"), list, "Nothing open. All caught up.", { full: true });
    setBadge(list.length);
  } catch {
    fill($("openList"), [], "Offline — open items need a connection.");
  }
}
async function loadOpenCount() {
  if (!navigator.onLine) return;
  try {
    const r = await fetch("/api/entries?view=open&limit=100");
    if (r.ok) setBadge(((await r.json()).entries || []).length);
  } catch {}
}
function setBadge(n) {
  const b = $("openBadge");
  b.textContent = String(n);
  b.hidden = n === 0;
}

/* ---- search ---- */
let searchTimer;
$("q").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if (q.length < 2) { fill($("searchList"), [], "Type at least 2 characters."); return; }
  searchTimer = setTimeout(async () => {
    try {
      const r = await fetch("/api/entries?view=search&q=" + encodeURIComponent(q));
      const d = await r.json();
      fill($("searchList"), d.entries || [], 'Nothing matches "' + q + '".', { full: true });
    } catch {
      fill($("searchList"), [], "Offline — search needs a connection.");
    }
  }, 250);
});

/* ------------------------------------------------------------------ detail */
let current = null;

document.addEventListener("click", (e) => {
  const row = e.target.closest(".entry[data-id]");
  if (row) openDetail(row.dataset.id);
});
$("detailBack").addEventListener("click", closeDetail);

function closeDetail() {
  $("detail").hidden = true;
  current = null;
  refreshCurrentView();
}

async function openDetail(id) {
  $("detail").hidden = false;
  $("detailBody").innerHTML = '<div class="empty">Loading…</div>';
  try {
    const r = await fetch("/api/entries/" + encodeURIComponent(id));
    if (!r.ok) throw new Error();
    current = await r.json();
    renderDetail();
  } catch {
    $("detailBody").innerHTML = '<div class="empty">Could not load this entry.</div>';
  }
}

function threadLink(label, e) {
  return '<p class="thread">' + label + '</p>' +
    '<button class="entry" data-id="' + esc(e.id) + '">' +
    '<span class="when">' + esc(fmtTime(e.created_at)) + '</span>' +
    '<span class="what">' + esc(e.body || "(photo)") + '</span></button>';
}

function renderDetail(rejectedText) {
  const e = current;
  const photos = (e.photos || [])
    // A photo that will not load (missing object, no signal) should leave nothing
    // behind rather than a broken-image sliver.
    .map((p) => '<img class="photo" src="' + esc(p.url) + '" alt="" onerror="this.remove()">')
    .join("");

  // §4: body_raw is the original dictation and is never overwritten. Only worth
  // showing once an edit has made it differ from the current text.
  const raw = e.body_raw && e.body_raw !== e.body
    ? '<div class="rawnote"><b>As originally dictated</b>' + esc(e.body_raw) + "</div>"
    : "";

  let thread = "";
  if (e.resolves)    thread += threadLink("Closes out", e.resolves);
  if (e.resolved_by) thread += threadLink("Closed out by", e.resolved_by);

  // §6 defence 2: a rejected edit is never silently dropped — show both and let the
  // user decide which to keep.
  const conflict = rejectedText
    ? '<div class="err on">This entry changed elsewhere while you were editing. ' +
      "The current text is below; yours was:<br><br><em>" + esc(rejectedText) +
      "</em><br><br>Edit again if you want to keep yours.</div>"
    : "";

  $("detailBody").innerHTML =
    conflict + photos +
    '<textarea id="editBody">' + esc(e.body || "") + "</textarea>" + raw +
    '<div class="actions">' +
      '<button class="btn sm" id="saveEdit">Save changes</button>' +
      '<button class="btn sm ghost" id="toggleOpen">' +
        (e.is_open ? "Mark done" : "Reopen") + "</button>" +
    "</div>" +
    '<dl class="meta">' +
      "<dt>when</dt><dd>" + esc(fmtFull(e.created_at)) + "</dd>" +
      "<dt>context</dt><dd>" + esc(e.context) + "</dd>" +
      "<dt>status</dt><dd>" + (e.is_open ? "open follow-up" : "closed") + "</dd>" +
      (e.edited_at ? "<dt>edited</dt><dd>" + esc(fmtFull(e.edited_at)) + "</dd>" : "") +
      (e.lat != null ? "<dt>where</dt><dd>" + e.lat.toFixed(5) + ", " + e.lng.toFixed(5) + "</dd>" : "") +
      "<dt>version</dt><dd>" + e.version + "</dd>" +
      "<dt>id</dt><dd>" + esc(e.id) + "</dd>" +
    "</dl>" + thread;

  $("saveEdit").addEventListener("click", saveEdit);
  $("toggleOpen").addEventListener("click", toggleOpen);
}

async function saveEdit() {
  const text = $("editBody").value;
  const btn = $("saveEdit");
  btn.disabled = true;
  try {
    const r = await fetch("/api/entries/" + encodeURIComponent(current.id), {
      method: "PATCH",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ body: text, version: current.version }),
    });
    const d = await r.json();
    if (r.status === 409) { current = d.current; renderDetail(text); return; }
    if (!r.ok) throw new Error();
    current = Object.assign({}, current, d);
    renderDetail();
  } catch {
    err("Could not save that edit.");
  } finally {
    btn.disabled = false;
  }
}

async function toggleOpen() {
  try {
    const r = await fetch("/api/entries/" + encodeURIComponent(current.id), {
      method: "PATCH",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ is_open: !current.is_open }),
    });
    if (!r.ok) throw new Error();
    current = await r.json();
    renderDetail();
    loadOpenCount();
  } catch {
    err("Could not update that follow-up.");
  }
}

/* ------------------------------------------------------------------ routing */
let view = "capture";
function refreshCurrentView() {
  if (view === "log") loadDay();
  else if (view === "open") loadOpen();
  else if (view === "capture") loadRecent();
}
function go(next) {
  view = next;
  ["capture", "log", "open", "search"].forEach((s) => {
    $("view-" + s).hidden = s !== next;
  });
  document.querySelectorAll("nav button").forEach((b) => {
    b.setAttribute("aria-current", String(b.dataset.view === next));
  });
  // Leaving capture with the camera live would hold the sensor open for nothing.
  if (next !== "capture") { stopCamera(); }
  refreshCurrentView();
  if (next === "search") $("q").focus();
}
document.querySelector("nav").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-view]");
  if (b) go(b.dataset.view);
});

/* ------------------------------------------------------------------ settings
   §10 asks for a theme picker outright ("ship the picker") and every colour is
   already a token, so the work is storing a choice and setting an attribute. Font
   selection is the same mechanism pointed at --font-ui.

   The preference is per-device on purpose for now: localStorage applies instantly and
   works with no signal, where a server round trip would mean a flash of the wrong
   theme on every load. Syncing it across devices needs a column on users, which is a
   migration -- worth doing, not worth bundling into this. */
const THEME_KEY = "note.theme", FONT_KEY = "note.font", CONTRAST_KEY = "note.contrast";
const readPref = (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } };
const writePref = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

function applyTheme(choice) {
  if (choice === "system") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = choice;
  // Keep the browser chrome in step with the app.
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = "#16222E";
  paintSettings();
}

function applyFont(choice) {
  if (choice === "inter") delete document.documentElement.dataset.font;
  else document.documentElement.dataset.font = choice;
  paintSettings();
}

function applyContrast(choice) {
  if (choice === "high") document.documentElement.dataset.contrast = "high";
  else delete document.documentElement.dataset.contrast;
  paintSettings();
}

function paintSettings() {
  const theme = readPref(THEME_KEY, "system");
  const font = readPref(FONT_KEY, "inter");
  const contrast = readPref(CONTRAST_KEY, "normal");
  document.querySelectorAll("[data-contrast-choice]").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.contrastChoice === contrast)));
  document.querySelectorAll("[data-theme-choice]").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.themeChoice === theme)));
  document.querySelectorAll("[data-font-choice]").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.fontChoice === font)));
}

$("themePick").addEventListener("click", (e) => {
  const b = e.target.closest("[data-theme-choice]");
  if (!b) return;
  writePref(THEME_KEY, b.dataset.themeChoice);
  applyTheme(b.dataset.themeChoice);
});
$("contrastPick").addEventListener("click", (e) => {
  const b = e.target.closest("[data-contrast-choice]");
  if (!b) return;
  writePref(CONTRAST_KEY, b.dataset.contrastChoice);
  applyContrast(b.dataset.contrastChoice);
});
$("fontPick").addEventListener("click", (e) => {
  const b = e.target.closest("[data-font-choice]");
  if (!b) return;
  writePref(FONT_KEY, b.dataset.fontChoice);
  applyFont(b.dataset.fontChoice);
});

$("gear").addEventListener("click", async () => {
  $("settings").hidden = false;
  paintSettings();
  let server = "unreachable";
  try { server = "v" + (await (await fetch("/api/health")).json()).version; } catch {}
  $("buildInfo").innerHTML =
    "<dt>page</dt><dd>v" + esc(PAGE_VERSION) + "</dd>" +
    "<dt>server</dt><dd>" + esc(server) + "</dd>";
});
$("settingsBack").addEventListener("click", () => { $("settings").hidden = true; });

/* ------------------------------------------------------------------ splash
   §10: plays on cold start only, skipped on reload by a sessionStorage flag. The app
   boots underneath it, so the animation costs nothing — by the time it clears the
   first entries are already loaded. Any touch ends it early, because §1 makes capture
   speed the property everything else is checked against. */
(function splash() {
  const el = $("splash");
  if (!el) return;

  let seen = false;
  try { seen = sessionStorage.getItem("note.splash") === "1"; } catch {}
  if (seen) { el.remove(); return; }
  try { sessionStorage.setItem("note.splash", "1"); } catch {}

  // Dash lengths must be measured, not guessed — they drive every draw animation.
  el.querySelectorAll(".mk path").forEach((path) =>
    path.style.setProperty("--len", Math.ceil(path.getTotalLength())));
  el.style.setProperty("--kl", Math.ceil(el.querySelector(".kl").getTotalLength()));

  const done = () => { el.classList.add("done"); el.remove(); };
  const timer = setTimeout(done, 4330);        // 3.85s + 0.36s clear, plus slack
  el.addEventListener("pointerdown", () => { clearTimeout(timer); done(); }, { once: true });

  requestAnimationFrame(() => el.classList.add("go"));
})();

/* ------------------------------------------------------------------ boot */
addEventListener("online",  () => { paintStatus(); flush(); });
addEventListener("offline", () => paintStatus());
setInterval(() => { if (navigator.onLine) flush(); }, 30000);

(async () => {
  idb = await openDb();
  paintSettings();
  await paintStatus();
  await renderRecent();
  checkVersion();
  loadRecent();
  loadOpenCount();
  flush();
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  }
})();
</script>
